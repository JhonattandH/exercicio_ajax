<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" id="user-profile-avatar" src="." alt="Avatar do usuário">
            <h1 class="profile-name" id="user-profile-name"></h1>
            <h2 class="profile-username" id="user-profile-username"></h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="user-profile-repos">0</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="user-profile-followers"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="user-profile-following"></span>
                </li>
            </ul>
            <a href="#" class="profile-link" id="user-profile-link">Ver no Github</a>
        </div>
    </header>
    <script src="jquery.js"></script>
    <script src="main.js"></script>
</body>
</html>
